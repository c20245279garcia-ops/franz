<section id="contact" class="w-full flex flex-col items-center">

            <form action="#">
                <!-- Name -->
                
        <label for="name"
               class="block text-sm font-bold text-black-700 mb-2">

        </label>  <input

                   outline-none">

                   text-gray-800
                   placeholder-gray-400
